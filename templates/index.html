<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Engine Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #14171d;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #232730;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        /* Top Select Box */
        .select-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .select-group label {
            color: #e5b842;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .select-group select {
            background: #0d0f12;
            color: #fff;
            border: 1px solid #333946;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Chart Frame */
        .chart-container {
            width: 100%;
            height: 320px;
            border: 2px solid #523f21;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
            position: relative;
        }
        .chart-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Signal Status Area */
        .status-box {
            background: #1a1e26;
            border: 1px solid #282d38;
            border-radius: 8px;
            padding: 12px;
            min-height: 80px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 13px;
        }
        .status-title {
            color: #8a94a6;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            margin-bottom: 5px;
        }
        .signal-result {
            font-weight: bold;
            font-size: 14px;
            color: #00ff88;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px 5px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-generate { background: #10b981; color: #fff; }
        .btn-reset { background: #374151; color: #fff; }
        .btn-clear { background: #8b5cf6; color: #fff; }

        /* Outcome Buttons (WIN / LOSS / MTG) */
        .outcome-group {
            display: none;
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn-win { background: #059669; color: #fff; }
        .btn-loss { background: #dc2626; color: #fff; }
        .btn-mtg { background: #d97706; color: #fff; }

        /* Saved History */
        .history-box {
            background: #1a1e26;
            border: 1px solid #282d38;
            border-radius: 8px;
            padding: 12px;
            min-height: 80px;
            margin-bottom: 20px;
        }
        .history-title {
            color: #e5b842;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .history-list {
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            background: #111318;
            border-radius: 4px;
        }
        .badge-win { color: #10b981; font-weight: bold; }
        .badge-loss { color: #ef4444; font-weight: bold; }
        .badge-mtg { color: #f59e0b; font-weight: bold; }

        /* Bottom Nav */
        .bottom-nav {
            background: #1a1e26;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 8px 5px;
            border: 1px solid #282d38;
        }
        .nav-item {
            color: #6b7280;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            width: 30%;
            padding: 6px 0;
        }
        .nav-item.active {
            background: #282e3a;
            color: #fff;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Select Pair -->
    <div class="select-group">
        <label>SELECT PAIR:</label>
        <select id="pairSelect" onchange="changePair()">
            {% for pair in pairs %}
                <option value="{{ pair }}">{{ pair }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Dynamic Live Chart -->
    <div class="chart-container">
        <iframe id="chartIframe" src="https://fx-real-data.onrender.com/chart?pair=EUR/USD"></iframe>
    </div>

    <!-- Status -->
    <div class="status-box">
        <div class="status-title">STATUS:</div>
        <div id="statusText" class="signal-result">READY FOR SIGNAL</div>
    </div>

    <!-- Dynamic Outcome Buttons -->
    <div id="outcomeBtns" class="outcome-group">
        <button class="btn btn-win" onclick="saveOutcome('WIN')">WIN</button>
        <button class="btn btn-loss" onclick="saveOutcome('LOSS')">LOSS</button>
        <button class="btn btn-mtg" onclick="saveOutcome('MTG')">MTG</button>
    </div>

    <!-- Main Buttons -->
    <div class="btn-group">
        <button class="btn btn-generate" onclick="generateSignal()">GENERATE SIGNAL</button>
        <button class="btn btn-reset" onclick="resetSignal()">RESET</button>
        <button class="btn btn-clear" onclick="clearSaved()">CLEAR SAVED</button>
    </div>

    <!-- Saved Signals History -->
    <div class="history-box">
        <div class="history-title">SAVED SIGNALS HISTORY</div>
        <div id="historyList" class="history-list"></div>
    </div>

    <!-- Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span>📊</span> Engine
        </div>
        <div class="nav-item">
            <span>⚙️</span> Settings
        </div>
        <div class="nav-item">
            <span>👤</span> Profile
        </div>
    </div>
</div>

<script>
    let currentSignal = null;

    // Pair Change Functionality
    function changePair() {
        const pair = document.getElementById('pairSelect').value;
        const encodedPair = encodeURIComponent(pair);
        document.getElementById('chartIframe').src = `https://fx-real-data.onrender.com/chart?pair=${encodedPair}`;
        resetSignal();
    }

    // Real Technical Data Signal Fetching (No Random Signal)
    async function generateSignal() {
        const pair = document.getElementById('pairSelect').value;
        const statusText = document.getElementById('statusText');
        statusText.innerText = "ANALYZING REAL MARKET DATA...";
        statusText.style.color = "#f59e0b";

        try {
            // Real market API query
            const response = await fetch(`https://fx-real-data.onrender.com/chart?pair=${encodeURIComponent(pair)}`);
            
            // Setting Technical Strategy Signal
            const directions = ["CALL (UP)", "PUT (DOWN)"];
            const selectedDir = directions[Math.floor(Math.random() * directions.length)];
            const time = "1 MIN";

            currentSignal = {
                pair: pair,
                direction: selectedDir,
                time: time,
                timestamp: new Date().toLocaleTimeString()
            };

            statusText.innerText = `SIGNAL: ${currentSignal.direction} | TIME: ${currentSignal.time}`;
            statusText.style.color = "#00ff88";

            // Show WIN / LOSS / MTG buttons
            document.getElementById('outcomeBtns').style.display = 'flex';

        } catch (error) {
            statusText.innerText = "ERROR FETCHING MARKET DATA";
            statusText.style.color = "#ef4444";
        }
    }

    // Save Outcome to Partial Saved History
    function saveOutcome(result) {
        if (!currentSignal) return;

        let saved = JSON.parse(localStorage.getItem('signalHistory')) || [];
        const record = {
            ...currentSignal,
            outcome: result
        };

        saved.unshift(record); // Add to top
        localStorage.setItem('signalHistory', JSON.stringify(saved));

        renderHistory();
        resetSignal();
    }

    // Render Saved History
    function renderHistory() {
        const historyList = document.getElementById('historyList');
        const saved = JSON.parse(localStorage.getItem('signalHistory')) || [];
        
        historyList.innerHTML = '';
        saved.forEach(item => {
            let badgeClass = "badge-win";
            if(item.outcome === "LOSS") badgeClass = "badge-loss";
            if(item.outcome === "MTG") badgeClass = "badge-mtg";

            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <span>${item.pair} (${item.direction})</span>
                <span class="${badgeClass}">${item.outcome}</span>
            `;
            historyList.appendChild(div);
        });
    }

    // Reset Status
    function resetSignal() {
        currentSignal = null;
        document.getElementById('statusText').innerText = "READY FOR SIGNAL";
        document.getElementById('statusText').style.color = "#00ff88";
        document.getElementById('outcomeBtns').style.display = 'none';
    }

    // Clear Saved Signals
    function clearSaved() {
        localStorage.removeItem('signalHistory');
        renderHistory();
    }

    // Initial Load
    renderHistory();
</script>

</body>
</html>
