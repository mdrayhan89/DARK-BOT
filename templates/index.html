<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK x AI BOT DASHBOARD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050811;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #0b1220;
            border: 1px solid #162c46;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #00f2ff;
            font-size: 24px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        .header p {
            color: #7a8b9e;
            font-size: 12px;
            margin-top: 4px;
        }

        /* সেটিংস টগল বক্স */
        .settings-card {
            background: #0d1829;
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-card label {
            color: #00f2ff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* সুইচ ডিজাইন */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #1a2c42;
            transition: .3s;
            border-radius: 24px;
            border: 1px solid #2a486c;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: #7a8b9e;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #00f2ff;
            border-color: #00f2ff;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: #050811;
        }

        /* সাধারণ লাইভ সিগন্যাল প্যানেল */
        .panel-box {
            background: #0e1a2d;
            border: 1px solid #1c3554;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            color: #8da4be;
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        select, input[type="text"], input[type="time"] {
            width: 100%;
            background: #07101d;
            color: #e0f7fa;
            border: 1px solid #1c3b5e;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #00f2ff;
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.2);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #0088cc, #00f2ff);
            border: none;
            color: #050811;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.4);
        }

        /* DARK FS MODE প্যানেল (ব্ল্যাকআউট ইউআই) */
        #darkFsPanel {
            display: none;
            background: #04070d;
            border: 1px solid #00f2ff33;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .fs-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .fs-title {
            color: #00f2ff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00f2ff;
        }

        .fs-subtitle {
            color: #00b8d4;
            font-size: 10px;
            letter-spacing: 1.5px;
            font-weight: bold;
            display: block;
            margin-top: 4px;
        }

        .output-box {
            margin-top: 15px;
            background: #040912;
            border: 1px dashed #1c3b5e;
            border-radius: 8px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #00f2ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- হেডার -->
        <div class="header">
            <h1>DARK x AI BOT</h1>
            <p>High Accuracy Realtime & Future Signal Engine</p>
        </div>

        <!-- সেটিংস: DARK FS MODE টগল সুইচ -->
        <div class="settings-card">
            <label for="darkFsToggle">DARK FS MODE</label>
            <label class="switch">
                <input type="checkbox" id="darkFsToggle" onchange="toggleDarkFsMode(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <!-- ১. সাধারণ লাইভ সিগন্যাল প্যানেল (ডিফল্ট দেখাবে) -->
        <div id="liveSignalPanel">
            <div class="panel-box">
                <div class="form-group">
                    <label for="livePair">কারেন্সি পেয়ার সিলেক্ট করুন</label>
                    <select id="livePair">
                        {% for pair in pairs %}
                            <option value="{{ pair }}">{{ pair }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="telegramToken">বট টোকেন (Bot Token)</label>
                    <input type="text" id="telegramToken" placeholder="123456789:ABCdef...">
                </div>

                <div class="form-group">
                    <label for="telegramChatId">চ্যাট আইডি (Chat ID)</label>
                    <input type="text" id="telegramChatId" placeholder="-100xxxxxxxxx">
                </div>

                <button class="btn-action" onclick="sendLiveSignal()">লাইভ সিগন্যাল পাঠান</button>
            </div>
        </div>

        <!-- ২. DARK FS MODE প্যানেল (OFF থাকলে হাইড থাকবে) -->
        <div id="darkFsPanel">
            <div class="fs-header">
                <div class="fs-title">DARK FUTURE AI</div>
                <span class="fs-subtitle">POWERED BY DARK SECRET</span>
            </div>

            <div class="form-group">
                <label>Select Pairs</label>
                <select id="fsPairs" multiple style="height: 110px;">
                    {% for pair in pairs %}
                        <option value="{{ pair }}" selected>{{ pair }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Start Time</label>
                <input type="time" id="fsStartTime" value="14:00">
            </div>

            <div class="form-group">
                <label>End Time</label>
                <input type="time" id="fsEndTime" value="18:00">
            </div>

            <div class="form-group">
                <label>Accuracy</label>
                <select id="fsAccuracy">
                    <option value="80">80%</option>
                    <option value="85" selected>85%</option>
                    <option value="90">90%</option>
                    <option value="95">95% (High Trend Filter)</option>
                </select>
            </div>

            <button class="btn-action" onclick="generateFutureSignals()">GENERATE FUTURE SIGNALS</button>

            <div id="fsLogs" class="output-box" style="display:none;"></div>
        </div>
    </div>

    <script>
        // প্যানেল সুইচ করার ফংশন
        function toggleDarkFsMode(isOn) {
            const livePanel = document.getElementById('liveSignalPanel');
            const fsPanel = document.getElementById('darkFsPanel');

            if (isOn) {
                livePanel.style.display = 'none';
                fsPanel.style.display = 'block';
            } else {
                livePanel.style.display = 'block';
                fsPanel.style.display = 'none';
            }
        }

        // লাইভ সিগন্যাল রিকোয়েস্ট
        function sendLiveSignal() {
            const pair = document.getElementById('livePair').value;
            const token = document.getElementById('telegramToken').value;
            const chatId = document.getElementById('telegramChatId').value;

            if(!token || !chatId) {
                alert("দয়া করে বট টোকেন এবং চ্যাট আইডি ইনপুট দিন!");
                return;
            }

            fetch('/api/analyze?pair=' + encodeURIComponent(pair))
            .then(res => res.json())
            .then(data => {
                const signalText = `====【 DARK x AI BOT 】====\n\n💎 » ${data.pair.replace('/','')}\n⏰ » Realtime\n⏳ » M1\n🔴 » ${data.direction}`;
                
                fetch('/api/send_telegram_signal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        chat_id: chatId,
                        text: signalText,
                        pair: pair,
                        with_ss: true
                    })
                })
                .then(r => r.json())
                .then(res => {
                    if(res.success) alert("ইনস্ট্যান্ট সিগন্যাল পাঠানো হয়েছে!");
                    else alert("এরর: " + res.error);
                });
            });
        }

        // ফিউচার সিগন্যাল জেনারেটর রিকোয়েস্ট
        function generateFutureSignals() {
            const pairsSelect = document.getElementById('fsPairs');
            const selectedPairs = Array.from(pairsSelect.selectedOptions).map(o => o.value);
            const startTime = document.getElementById('fsStartTime').value;
            const endTime = document.getElementById('fsEndTime').value;
            const accuracy = document.getElementById('fsAccuracy').value;

            fetch('/api/generate_future_signals', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pairs: selectedPairs,
                    start_time: startTime,
                    end_time: endTime,
                    accuracy: accuracy
                })
            })
            .then(res => res.json())
            .then(data => {
                const logsBox = document.getElementById('fsLogs');
                if(data.success && data.signals.length > 0) {
                    logsBox.style.display = 'block';
                    let text = `<b>জেনারেট হওয়া ${data.signals.length}টি সিগন্যাল:</b><br><br>`;
                    data.signals.forEach(s => {
                        text += `⏰ ${s.time} | ${s.pair} | <b>${s.direction}</b> (${s.accuracy})<br>`;
                    });
                    logsBox.innerHTML = text;
                } else {
                    alert("ফিল্টার কন্ডিশন অনুযায়ী কোনো সিগন্যাল পাওয়া যায়নি!");
                }
            });
        }
    </script>
</body>
</html>
