<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Trading Bot Engine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body {
      background-color: #0b0f12;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 80px 12px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Top Chart Container Box */
    .chart-container-box {
      width: 100%;
      height: 380px;
      background: #000000;
      border: 2px solid #5a422d;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(90, 66, 45, 0.3);
      position: relative;
    }

    .chart-container-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Signal Buttons Group */
    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: space-between;
    }

    .btn {
      flex: 1;
      padding: 16px 8px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-generate {
      background: #22c55e;
      color: #000000;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }

    .btn-reset {
      background: #334155;
      color: #f87171;
      border: 1px solid #475569;
    }

    .btn-result {
      background: #8b5cf6;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    /* Signal Output Box */
    .signal-output-box {
      background: rgba(18, 24, 27, 0.8);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 50px;
    }

    .signal-text {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }

    .signal-value {
      font-size: 14px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 6px;
    }

    .signal-call { background: #16a34a; color: #fff; }
    .signal-put { background: #dc2626; color: #fff; }

    /* Bottom Glassmorphism Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 480px;
      background: rgba(30, 35, 45, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      padding: 6px;
      z-index: 1000;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      color: #64748b;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      margin-bottom: 2px;
    }

    .nav-item.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Chart Box connected to Live URL -->
    <div class="chart-container-box">
      <iframe id="chartFrame" src="/chart?pair=EUR/USD"></iframe>
    </div>

    <!-- Signal Output Display -->
    <div class="signal-output-box">
      <span class="signal-text" id="statusText">STATUS: READY FOR SIGNAL</span>
      <span class="signal-value" id="signalValue" style="display:none;">---</span>
    </div>

    <!-- Control Buttons -->
    <div class="btn-group">
      <button class="btn btn-generate" onclick="generateSignal()">GENERATE<br>SIGNAL</button>
      <button class="btn btn-reset" onclick="resetEngine()">RESET</button>
      <button class="btn btn-result" onclick="checkPartialResult()">PARTIAL<br>RESULT</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M6 4h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2zm3 5v6h2V9H9zm4 0v6h2V9h-2z"/></svg>
      Engine
    </a>
    <a href="#" class="nav-item" onclick="alert('Settings section coming next!')">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      Settings
    </a>
    <a href="#" class="nav-item" onclick="alert('Profile section coming next!')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Profile
    </a>
  </div>

  <script>
    function generateSignal() {
      const statusText = document.getElementById('statusText');
      const signalValue = document.getElementById('signalValue');
      
      statusText.innerText = "ANALYZING MARKET...";
      signalValue.style.display = "none";

      setTimeout(() => {
        const isCall = Math.random() > 0.45;
        statusText.innerText = "SIGNAL GENERATED:";
        signalValue.innerText = isCall ? "CALL (BUY) ▲" : "PUT (SELL) ▼";
        signalValue.className = "signal-value " + (isCall ? "signal-call" : "signal-put");
        signalValue.style.display = "inline-block";
      }, 1500);
    }

    function resetEngine() {
      document.getElementById('statusText').innerText = "STATUS: RESET COMPLETE";
      document.getElementById('signalValue').style.display = "none";
    }

    function checkPartialResult() {
      alert("Checking partial market result...");
    }
  </script>
</body>
</html>
